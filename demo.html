<style>

/* modern rounded pass */
.bar,#sendbar{border-radius:26px;overflow:hidden}

/* ===================== DESIGN SYSTEM (single source of truth) =====================
   Change a token or a group here and every screen that uses it follows. */
:root{
 /* grid (phone 402x874) */
 --ds-m:38px; --ds-top:76px; --ds-bot:798px; --ds-w:326px;
 --ds-icon-top:56px;            /* top of 56px icon buttons (back, next ...) */
 --ds-title-top:100px;
 /* type */
 --ds-title:38px; --ds-title-lh:36px; --ds-title-ls:-1.1px;
 --ds-sub:28px;                 /* item names, Next */
 --ds-btn-fs:24px;              /* big buttons, list rows */
 --ds-tool:21px;                /* tool labels */
 --ds-label:12px; --ds-label-ls:.72px;  /* chips, tabs, captions caps */
 --ds-cap:13px;
 /* shape */
 --ds-bar-h:66px; --ds-r-bar:26px; --ds-r-chip:18px; --ds-icon:56px;
 /* bar slots: bottom bar and the one above it */
 --ds-bar-y:732px; --ds-bar2-y:658px;
}
/* 1. Screen titles */
#tShare,#tHist,#tMerch,#tOrder,#dW{font-size:var(--ds-title)!important;line-height:var(--ds-title-lh)!important;letter-spacing:var(--ds-title-ls)!important;top:var(--ds-title-top)!important;left:var(--ds-m)!important}
/* 2. Big bottom buttons (all the same size, one slot) */
.bar,.wbtn.sw,#bbar,#sendbar,#printbar,#mbar,#obar,#dBuy,#dShare,#thbar{left:var(--ds-m)!important;width:var(--ds-w)!important;height:var(--ds-bar-h)!important;border-radius:var(--ds-r-bar)!important;font-size:var(--ds-btn-fs)!important;font-weight:700!important;letter-spacing:-.02em!important}
.bar,#bbar,#sendbar,#printbar,#mbar,#obar,#dShare{top:var(--ds-bar-y)!important}
#dBuy{top:var(--ds-bar2-y)!important}
/* 3. Chips / tabs */
#poster .ch,#fcats button{font-size:var(--ds-label)!important;letter-spacing:var(--ds-label-ls)!important;height:36px!important;border-radius:var(--ds-r-chip)!important;font-weight:700!important;text-transform:uppercase}
/* 4. Tool labels (bottom of edit) */
#poster #tcol button{font-size:var(--ds-tool)!important}
/* 5. Icon buttons: back / close share one size and slot */
.scr .bk,#feed .bk{width:var(--ds-icon)!important;height:var(--ds-icon)!important;top:var(--ds-icon-top)!important}
/* 6. List rows and item names */
.pl{font-size:var(--ds-btn-fs)!important}
#mname,#order span{font-size:var(--ds-sub)!important}

/* ===== round 3: pull-down tab, peek, camera back, tools ===== */
#cam > .bk{left:auto!important;right:var(--ds-m)!important;top:76px!important;width:auto!important;height:14px!important;text-align:right!important}
#done>.bk,#buy>.bk,#room>.bk,#share>.bk,#hist>.bk,#merch>.bk,#order>.bk,#feed>.bk{display:none!important}
#feed.lst>.bk,#feed.prof>.bk{display:flex!important}
.ptab{position:absolute;left:50%;top:40px;width:104px;height:30px;margin-left:-52px;background:#000;border-radius:0 0 18px 18px;z-index:61;display:grid;place-items:end center;padding-bottom:3px;pointer-events:none;animation:ptn 1.1s .7s 1}
.ptab svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@keyframes ptn{0%,100%{transform:translateY(0)}40%{transform:translateY(8px)}}
#fpeek{position:absolute;left:0;right:0;top:812px;height:90px;border-radius:26px 26px 0 0;background:#fff;box-shadow:0 -3px 16px rgba(0,0,0,.14);z-index:7;display:none;overflow:hidden;pointer-events:none}

#fpeek:before{content:"";position:absolute;left:50%;top:8px;width:44px;height:4px;margin-left:-22px;border-radius:2px;background:var(--ink)}

/* edit screen: equal gaps between poster, chips, swatches, tools, screen edge */
#poster #spn{top:652px!important}

/* Next: white, with a black shine sweeping through every few seconds */
#poster #nextbtn{background:linear-gradient(100deg,var(--nx,#F0E810) 0 36%,#fff 46% 54%,var(--nx,#F0E810) 64% 100%) 100% 0/300% 100% no-repeat;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important;-webkit-text-fill-color:transparent!important;border-radius:0!important;padding:0!important;text-shadow:none!important;mix-blend-mode:normal!important;filter:drop-shadow(0 0 5px rgba(0,0,0,.3));animation:nxs 3.6s ease-in-out infinite}
